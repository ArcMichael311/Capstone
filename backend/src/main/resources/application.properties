spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:${SUPABASE_DB_URL:jdbc:h2:mem:phonexis;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driverClassName=${DB_DRIVER:${SUPABASE_DB_DRIVER:org.h2.Driver}}
spring.datasource.username=${DB_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:${SUPABASE_DB_DDL_AUTO:update}}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:${SUPABASE_DB_DIALECT:org.hibernate.dialect.H2Dialect}}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME:120000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1500000}
server.error.include-message=always
app.frontend-url=${FRONTEND_URL:}
app.admin-email=${ADMIN_EMAIL:phonexisadmin@gmail.com}

# Learning materials uploads (PPT/PDF/MP4/MP3)
app.max-upload-size-mb=${MAX_UPLOAD_SIZE_MB:50}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE_MB:50}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE_MB:50}MB

# Supabase Storage (service-role access; keep SUPABASE_SERVICE_ROLE_KEY secret, backend-only)
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:learning-materials}
