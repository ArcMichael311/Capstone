spring.application.name=backend
spring.datasource.url=${DB_URL:${SUPABASE_DB_URL:jdbc:h2:mem:phonexis;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driverClassName=${DB_DRIVER:${SUPABASE_DB_DRIVER:org.h2.Driver}}
spring.datasource.username=${DB_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:${SUPABASE_DB_DDL_AUTO:update}}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:${SUPABASE_DB_DIALECT:org.hibernate.dialect.H2Dialect}}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
server.error.include-message=always
